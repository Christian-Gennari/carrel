# Stylos image — Debian 13 (trixie), amd64.
#
# WP1 builds a single bootable disk image that works on UEFI (systemd-boot)
# and legacy BIOS (GRUB).  A/B partitions, verity and sysupdate are WP7; the
# default mkosi layout (ESP + BIOS boot + root) leaves room for them because
# the partition table is generated by systemd-repart and can be replaced by
# image/mkosi.repart/ later.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# `Repositories=` adds APT components in mkosi (it is not a list of URLs).
Repositories=non-free-firmware
# The image must boot offline; the package manager and the typst download
# still need the network at build time.
[Build]
WithNetwork=yes
Incremental=no

[Output]
Format=disk
Output=stylos.img
ImageId=stylos
ImageVersion=0.1.0
SplitArtifacts=

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=grub
KernelCommandLine=console=tty0 console=ttyS0,115200 systemd.getty_auto=no
Hostname=stylos
Locale=C.UTF-8
Timezone=UTC
WithRecommends=no
Packages=
    linux-image-amd64
    firmware-linux-free
    firmware-iwlwifi
    firmware-realtek
    firmware-atheros
    firmware-misc-nonfree
    systemd
    systemd-boot-efi
    systemd-sysv
    udev
    grub-pc-bin
    dbus
    login
    passwd
    procps
    rfkill
    wpasupplicant
    network-manager
    xkb-data
    fonts-dejavu-core
    libgl1-mesa-dri
    cage
    libgtk-4-1
    pandoc
    curl
    ca-certificates
BuildPackages=
    gcc
    pkg-config
    libgtk-4-dev
