# Carrel image — Debian 13 (trixie), amd64.
#
# One GPT disk image for USB sticks and installation.  The layout is created
# by systemd-repart from image/mkosi.repart/:
#
#   ESP (1 GiB)          systemd-boot, A/B UKIs, kernel/initrd for GRUB
#   BIOS boot (1 MiB)    GRUB i386-pc core image
#   root-a (2 GiB)       erofs, read-only
#   root-b (2 GiB)       erofs, read-only (inactive slot)
#   data (>= 2 GiB)      ext4, grows to the rest of the disk at install
#
# Both slots are populated in the image so a fresh install can be updated on
# day one.  /data/writing, /var and the upper layer of /etc live on data.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# `Repositories=` adds APT components in mkosi (it is not a list of URLs).
Repositories=non-free-firmware
# The image must boot offline; the package manager and the typst download
# still need the network at build time.
[Build]
WithNetwork=yes
Incremental=no

[Output]
Format=disk
Output=carrel.img
ImageId=carrel
ImageVersion=0.1.0
SplitArtifacts=

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=grub
# Slot-specific roothash=, verity device paths and carrel.slot= are added when
# the per-slot UKIs and the GRUB menu are generated (image/assemble.py).  mkosi
# keeps this base command line only for its own throw-away UKI.
KernelCommandLine=console=tty0 console=ttyS0,115200 systemd.getty_auto=no ro rootfstype=erofs
Hostname=carrel
Locale=C.UTF-8
Timezone=UTC
WithRecommends=no
Packages=
    linux-image-amd64
    firmware-linux-free
    firmware-iwlwifi
    firmware-realtek
    firmware-atheros
    firmware-misc-nonfree
    systemd
    systemd-container
    systemd-boot-efi
    # Secure Boot chain (WP7c): Microsoft-signed shim, Debian-signed
    # systemd-boot (the Debian-signed kernel is linux-image-amd64 above) and
    # efibootmgr for the installer.
    shim-signed
    systemd-boot-efi-amd64-signed
    efibootmgr
    # CPU microcode and AMD GPU firmware (WP7d).
    intel-microcode
    amd64-microcode
    firmware-amd-graphics
    # systemd-veritysetup and its initrd generator for roothash=.
    systemd-cryptsetup
    cryptsetup-bin
    systemd-sysv
    udev
    dbus
    login
    passwd
    procps
    util-linux
    e2fsprogs
    dosfstools
    erofs-utils
    systemd-repart
    # SHA256SUMS.gpg verification for systemd-sysupdate.
    gpg
    upower
    rfkill
    wpasupplicant
    network-manager
    xkb-data
    fontconfig
    fonts-dejavu-core
    fonts-inter
    fonts-jetbrains-mono
    libgl1-mesa-dri
    libvulkan1
    cage
    libgtk-4-1
    libgtksourceview-5-0
    pandoc
    curl
    ca-certificates
    grub-pc-bin
    grub-common
    whiptail
    rsync
# The Rust binaries are compiled by the dev container (make image) and
# installed by mkosi.build; no compilers are needed in the mkosi build image.
BuildPackages=
