# EFI system partition: systemd-boot, the A/B unified kernel images and the
# kernel/initrd pair used by the BIOS GRUB path.  1 GiB because two UKIs
# (~160 MiB each, including the modules initrd), the recovery UKI and the
# GRUB kernel/initrd do not fit in the 512 MiB from the first spec draft.
[Partition]
Type=esp
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
SizeMinBytes=1G
SizeMaxBytes=1G
Label=stylos-esp
UUID=44444444-4444-4444-8444-444444444444
