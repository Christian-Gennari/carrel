# dm-verity hash tree for the active root slot.  The UUID is fixed so every
# slot UKI can name the hash device directly; the root hash itself changes
# with each release and lives in the signed UKI command line.
[Partition]
Type=root-x86-64-verity
Verity=hash
VerityMatchKey=root-a
Label=carrel-verity-0.1.0
UUID=55555555-5555-4555-8555-555555555555
SizeMinBytes=64M
SizeMaxBytes=64M
