# Inactive root slot.  A fresh image ships both slots populated so the first
# update does not have to download a whole root filesystem first.
[Partition]
Type=root-x86-64
Format=erofs
CopyFiles=/:/
ExcludeFiles=/boot/ /efi/
SizeMinBytes=2G
SizeMaxBytes=2G
# The label carries the installed version.  systemd-sysupdate compares the
# two root partitions by it and always writes the older one; the freshly
# installed image has the running slot at 0.2.2 and the spare at 0.
Label=carrel-root-0
UUID=22222222-2222-4222-8222-222222222222
Verity=data
VerityMatchKey=root-b
