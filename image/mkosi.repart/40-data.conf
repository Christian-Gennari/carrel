# Data partition: writing, /var and the /etc overlay upper layer.  It is
# created at 2 GiB in the image and grown to fill the disk by
# stylos-grow-data.service (and by the installer before the first boot).
[Partition]
Type=linux-generic
Format=ext4
SizeMinBytes=2G
GrowFileSystem=yes
Label=stylos-data
UUID=33333333-3333-4333-8333-333333333333
