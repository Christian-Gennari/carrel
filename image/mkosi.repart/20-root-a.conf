# Active root slot.  The label carries the release version because
# systemd-sysupdate identifies installed partition versions by the @v part of
# the label; the stable UUIDs are what the UKI uses as
# systemd.verity_root_data=/systemd.verity_root_hash= across updates.
[Partition]
Type=root-x86-64
Format=erofs
CopyFiles=/:/
ExcludeFiles=/boot/ /efi/
SizeMinBytes=2G
SizeMaxBytes=2G
Label=carrel-root-0.2.2
UUID=11111111-1111-4111-8111-111111111111
Verity=data
VerityMatchKey=root-a
