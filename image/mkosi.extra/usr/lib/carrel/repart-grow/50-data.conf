# Grow the data partition to fill the disk.  Called by
# carrel-grow-data.service on first boot after a raw image was written to a
# larger disk, and by the installer before it reboots.
#
# systemd-repart only describes the data partition here: the ESP and both root
# slots are already correct and must not be touched.
[Partition]
Type=linux-generic
Format=ext4
Label=carrel-data
SizeMinBytes=2G
GrowFileSystem=yes
