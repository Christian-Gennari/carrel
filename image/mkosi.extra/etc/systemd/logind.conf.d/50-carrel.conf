# Carrel defaults for systemd-logind.
# The lid suspends the machine; the shell flushes its journal on
# PrepareForSleep(true) (see spec/01-architecture.md).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
IdleAction=ignore
# carreld delays power off for its "Sync at shutdown" (at most 13 s) and
# suspend for a history commit.  The default of 5 s would cut the sync short.
InhibitDelayMaxSec=20
