[package]
name = "carrel-shell"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Carrel writing shell: a calm, keyboard-first Markdown editor"

[[bin]]
name = "carrel-shell"
path = "src/main.rs"

[[bin]]
name = "carrel-crash-writer"
path = "src/bin/crash-writer.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
sourceview = { package = "sourceview5", version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
futures-util.workspace = true
qrcode = { version = "0.14", default-features = false }
tokio.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile = "3"
carreld = { path = "../carreld" }
carrel-protocol = { path = "../protocol" }
