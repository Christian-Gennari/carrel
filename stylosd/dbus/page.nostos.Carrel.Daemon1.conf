<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for stylosd (install as
  /usr/share/dbus-1/system.d/page.nostos.Carrel.Daemon1.conf).

  D-Bus applies the LAST matching rule, so the blanket deny for everyone comes
  first and the two narrow exceptions follow it. Only root may own the name;
  only root and the `writer` user may call it or receive its signals.
-->
<busconfig>
  <policy context="default">
    <deny own="page.nostos.Carrel.Daemon1"/>
    <deny send_destination="page.nostos.Carrel.Daemon1"/>
    <deny receive_sender="page.nostos.Carrel.Daemon1"/>
  </policy>

  <policy user="root">
    <allow own="page.nostos.Carrel.Daemon1"/>
    <allow send_destination="page.nostos.Carrel.Daemon1"/>
    <allow receive_sender="page.nostos.Carrel.Daemon1"/>
  </policy>

  <policy user="writer">
    <allow send_destination="page.nostos.Carrel.Daemon1"/>
    <allow receive_sender="page.nostos.Carrel.Daemon1"/>
  </policy>
</busconfig>
